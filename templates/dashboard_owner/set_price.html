{% extends "base.html" %}

{% block content %}
<section class="section">
  <div class="ota-container">
    <div >
      <h1 class="mb-4">Set Pricing</h1>
      <p class="mb-12 text-secondary" >
        Configure pricing for {{ room.name }}
      </p>

      <div class="card">
        <form method="post">
          {% csrf_token %}
          
          <div class="form-group">
            <label>Base Price Per Night</label>
            {{ form.base_price }}
            <p class="form-hint">Core room rate before add-ons</p>
          </div>

          <div class="p-6 rounded-lg mb-8 bg-tertiary" >
            <h4 class="m-4">Pricing Breakdown</h4>
            <div class="text-sm text-secondary" >
              <div class="d-flex justify-between mb-2">
                <span>Base Rate</span>
                <span id="base-display">₹0</span>
              </div>
              <div class="d-flex justify-between mb-2">
                <span>Service Fee (8%)</span>
                <span id="fee-display">₹0</span>
              </div>
              <div class="d-flex justify-between pt-2 font-semibold text-primary" >
                <span>Total Per Night</span>
                <span id="total-display">₹0</span>
              </div>
            </div>
          </div>

          <button type="submit" class="button button-accent button-block button-lg mt-8">
            Save Pricing
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
