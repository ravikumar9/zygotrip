{# PHASE 8: Enhanced search bar with Tailwind styling #}
<form method="get" class="hotels-search flex gap-2" action="{{ search_action|default:'' }}" data-search-form>
  <div class="flex-1 relative">
    <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
    <input
      type="text"
      name="q"
      value="{{ search_query }}"
      placeholder="{{ search_placeholder|default:'Search city, area, landmark, or hotel' }}"
      class="filter-input w-full pl-10 pr-4 py-3 rounded-full shadow-sm border border-gray-300 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition"
      data-search-input
      autocomplete="off"
    />
  </div>
  <button type="submit" class="button button-primary px-6 py-3 rounded-full font-medium shrink-0">
    {{ search_button_label|default:'Search' }}
  </button>
</form>
<script>
  {# PHASE 8: Debounce search input to reduce query spam #}
  const searchInput = document.querySelector('[data-search-input]');
  const searchForm = document.querySelector('[data-search-form]');
  let debounceTimer;
  
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function() {
        searchForm.submit();
      }, 400);  // 400ms debounce
    });
  }
</script>
