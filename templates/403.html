{% extends 'base.html' %}

{% block content %}
<section class="section">
  <div class="container">
    <div style="text-align: center; padding: var(--space-16) 0;">
      <div style="font-size: 5rem; margin-bottom: var(--space-6);">🔒</div>
      <h1 style="color: var(--color-danger); margin-bottom: var(--space-4);">Access Denied</h1>
      <p style="font-size: var(--fs-lg); color: var(--color-text-secondary); margin-bottom: var(--space-8); max-width: 500px; margin-left: auto; margin-right: auto;">
        You do not have permission to access this resource. If you believe this is an error, please contact support.
      </p>
      
      <div style="display: flex; gap: var(--space-4); justify-content: center; flex-wrap: wrap;">
        <a href="/" class="button button-primary button-lg">Back to Home</a>
        <a href="/hotels/" class="button button-secondary button-lg">Browse Hotels</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
