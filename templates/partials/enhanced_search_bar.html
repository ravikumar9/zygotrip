<!-- Enhanced Search Bar Component -->
<div class="search-bar-container bg-white rounded-lg shadow-lg p-6">
  <form method="get" action="/search/" class="search-form">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      
      <!-- Location with Autocomplete -->
      <div class="search-field">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          <span class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            Location
          </span>
        </label>
        <input 
          type="text" 
          name="location" 
          id="location-autocomplete"
          placeholder="City, area, or landmark"
          class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20"
          autocomplete="off"
        />
        <div id="location-suggestions" class="suggestions-dropdown"></div>
      </div>

      <!-- Check-in Date -->
      <div class="search-field">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          <span class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            Check-in
          </span>
        </label>
        <input 
          type="date" 
          name="checkin" 
          class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20"
        />
      </div>

      <!-- Check-out Date -->
      <div class="search-field">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          <span class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            Check-out
          </span>
        </label>
        <input 
          type="date" 
          name="checkout" 
          class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20"
        />
      </div>

      <!-- Guests -->
      <div class="search-field">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          <span class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            Guests
          </span>
        </label>
        <select 
          name="guests" 
          class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20"
        >
          <option value="1">1 Guest</option>
          <option value="2" selected>2 Guests</option>
          <option value="3">3 Guests</option>
          <option value="4">4 Guests</option>
          <option value="5">5+ Guests</option>
        </select>
      </div>

    </div>

    <!-- Search Button -->
    <div class="mt-6 flex justify-center">
      <button type="submit" class="primary-btn px-8 py-3 bg-primary hover:bg-primary-hover text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition-all duration-200 flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        Search Properties
      </button>
    </div>
  </form>
</div>

<script>
// Autocomplete functionality
document.addEventListener('DOMContentLoaded', function() {
  const locationInput = document.getElementById('location-autocomplete');
  const suggestionsDiv = document.getElementById('location-suggestions');
  let debounceTimer;

  locationInput.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    const query = this.value.trim();
    
    if (query.length < 2) {
      suggestionsDiv.innerHTML = '';
      suggestionsDiv.classList.remove('active');
      return;
    }

    debounceTimer = setTimeout(() => {
      fetch(`/search/autocomplete?q=${encodeURIComponent(query)}`)
        .then(response => response.json())
        .then(data => {
          if (data.results && data.results.length > 0) {
            suggestionsDiv.innerHTML = data.results.map(item => `
              <div class="suggestion-item" data-value="${item.name}">
                <strong>${item.name}</strong>
                <span class="text-sm text-gray-500">${item.city}, ${item.state}</span>
              </div>
            `).join('');
            suggestionsDiv.classList.add('active');

            // Add click handlers
            document.querySelectorAll('.suggestion-item').forEach(item => {
              item.addEventListener('click', function() {
                locationInput.value = this.dataset.value;
                suggestionsDiv.innerHTML = '';
                suggestionsDiv.classList.remove('active');
              });
            });
          }
        })
        .catch(err => console.error('Autocomplete error:', err));
    }, 300);
  });

  // Close suggestions on outside click
  document.addEventListener('click', function(e) {
    if (!locationInput.contains(e.target) && !suggestionsDiv.contains(e.target)) {
      suggestionsDiv.innerHTML = '';
      suggestionsDiv.classList.remove('active');
    }
  });
});
</script>
