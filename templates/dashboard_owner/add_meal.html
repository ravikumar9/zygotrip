{% extends "base.html" %}

{% block content %}
<section class="section">
  <div class="ota-container">
    <div >
      <h1 class="mb-4">Add Meal Plan</h1>
      <p class="mb-12 text-secondary" >
        Create a meal plan for {{ property.name }}
      </p>

      <div class="card">
        <form method="post">
          {% csrf_token %}
          
          <div class="form-group">
            <label>Meal Plan Name</label>
            {{ form.name }}
            <p class="form-hint">E.g., Breakfast Included, All-Inclusive</p>
          </div>

          <div class="form-group">
            <label>Price Per Person Per Night</label>
            {{ form.price }}
            <p class="form-hint">Added to room rate if selected</p>
          </div>

          <button type="submit" class="button button-accent button-block button-lg mt-8">
            Create Meal Plan
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
