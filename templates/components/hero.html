{# REUSABLE HERO COMPONENT - OTA-STYLE DEPTH #}
<style>
  .hero-gradient {
    background: linear-gradient(135deg, #ff512f 0%, #dd2476 50%, #6a11cb 100%);
    padding: 80px 0 120px;
    position: relative;
    overflow: hidden;
  }
  
  .hero-gradient::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" opacity="0.1"/></pattern></defs><rect width="1200" height="600" fill="url(%23grid)"/></svg>');
    opacity: 0.1;
  }
  
  .hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: white;
  }
  
  .hero-title {
    font-size: 3.5rem;
    font-weight: 700;
    margin-bottom: 16px;
    line-height: 1.2;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
  }
  
  .hero-subtitle {
    font-size: 1.25rem;
    margin-bottom: 40px;
    opacity: 0.95;
  }
  
  .search-container {
    max-width: 600px;
    margin: 0 auto;
    margin-top: -60px;
    position: relative;
    z-index: 20;
  }
  
  .search-form {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
  }
  
  .search-form-group {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 12px;
    align-items: end;
  }
  
  .search-form-field {
    display: flex;
    flex-direction: column;
  }
  
  .search-form-field label {
    font-size: 0.875rem;
    font-weight: 600;
    color: #333;
    margin-bottom: 6px;
  }
  
  .search-form-field input,
  .search-form-field select {
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 1rem;
    font-family: inherit;
  }
  
  .search-form-field input:focus,
  .search-form-field select:focus {
    outline: none;
    border-color: #dd2476;
    box-shadow: 0 0 0 3px rgba(221, 36, 118, 0.1);
  }
  
  .search-submit {
    background: linear-gradient(135deg, #ff512f 0%, #dd2476 100%);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 24px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    min-width: 120px;
  }
  
  .search-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(221, 36, 118, 0.3);
  }
  
  @media (max-width: 768px) {
    .hero-gradient {
      padding: 60px 0 100px;
    }
    
    .hero-title {
      font-size: 2rem;
    }
    
    .hero-subtitle {
      font-size: 1rem;
    }
    
    .search-form-group {
      grid-template-columns: 1fr;
    }
  }
</style>

<div class="hero-gradient">
  <div class="hero-content">
    <h1 class="hero-title">{{ title|default:"Find Your Perfect Hotel" }}</h1>
    <p class="hero-subtitle">{{ subtitle|default:"Explore thousands of properties and book your next adventure" }}</p>
  </div>
  
  {% if show_search %}
  <div class="search-container">
    <form method="get" action="{% url 'search:list' %}" class="search-form">
      <div class="search-form-group">
        <div class="search-form-field">
          <label for="search-location">Location</label>
          <input 
            type="text" 
            id="search-location"
            name="q" 
            placeholder="City, area or hotel name..."
            autocomplete="off"
            class="autocomplete-input"
          >
        </div>
        
        <div class="search-form-field">
          <label for="search-checkin">Check-in</label>
          <input 
            type="date" 
            id="search-checkin"
            name="check_in"
            required
          >
        </div>
        
        <div class="search-form-field">
          <label for="search-checkout">Check-out</label>
          <input 
            type="date" 
            id="search-checkout"
            name="check_out"
            required
          >
        </div>
        
        <button type="submit" class="search-submit">Search</button>
      </div>
    </form>
  </div>
  
  <script>
    // Date picker validation
    const checkinInput = document.getElementById('search-checkin');
    const checkoutInput = document.getElementById('search-checkout');
    const today = new Date().toISOString().split('T')[0];
    
    checkinInput.min = today;
    checkoutInput.min = today;
    
    checkinInput.addEventListener('change', () => {
      checkoutInput.min = checkinInput.value;
      if (checkoutInput.value && checkoutInput.value <= checkinInput.value) {
        checkoutInput.value = '';
      }
    });
    
    checkoutInput.addEventListener('change', () => {
      if (checkoutInput.value && checkoutInput.value <= checkinInput.value) {
        alert('Checkout date must be after checkin date.');
        checkoutInput.value = '';
      }
    });
    
    // Autocomplete functionality
    const locationInput = document.querySelector('.autocomplete-input');
    if (locationInput) {
      locationInput.addEventListener('input', async (e) => {
        const query = e.target.value.trim();
        if (query.length < 2) return;
        
        try {
          const response = await fetch(`/search/autocomplete/?q=${encodeURIComponent(query)}`);
          const data = await response.json();
          // Implement autocomplete dropdown UI if needed
          console.log('Autocomplete results:', data);
        } catch (error) {
          console.error('Autocomplete error:', error);
        }
      });
    }
  </script>
  {% endif %}
</div>
