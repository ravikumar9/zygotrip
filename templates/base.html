{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Zygotrip - Premium travel booking platform" />
    <title>{% block title %}Zygotrip{% endblock %}</title>
    <link rel="icon" href="{% static 'img/globe.svg' %}" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- PHASE 1: Design System & Tokens -->
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}" />
    <link rel="stylesheet" href="{% static 'css/design-system.css' %}" />
    <link rel="stylesheet" href="{% static 'css/enterprise-ui.css' %}" />
    
    <!-- PHASE 7: Card Layout -->
    <link rel="stylesheet" href="{% static 'css/hotel-card.css' %}" />
    
    {% block extra_css %}{% endblock %}
  </head>
  <body class="ota-root">
    {% include "components/header.html" %}
    
    {% block hero %}{% endblock %}
    
    <main class="page-main">
      {% block content %}{% endblock %}
    </main>

    {% include "components/footer.html" %}
  </body>
</html>
